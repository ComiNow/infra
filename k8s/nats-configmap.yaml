apiVersion: v1
kind: ConfigMap
metadata:
  name: nats-config
  namespace: cominow
data:
  nats-server.conf: |
    # NATS Server Configuration
    port: 4222
    http_port: 8222

    # Maximum payload size (10MB)
    max_payload: 10485760

    # Cluster configuration
    cluster {
      name: my_cluster
      port: 6222
    }
