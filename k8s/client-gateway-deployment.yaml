apiVersion: apps/v1
kind: Deployment
metadata:
  name: client-gateway
  namespace: cominow
  labels:
    app: client-gateway
  annotations:
    argocd-image-updater.argoproj.io/image-list: client-gateway=515966498907.dkr.ecr.us-east-2.amazonaws.com/cominow/client-gateway
    argocd-image-updater.argoproj.io/client-gateway.update-strategy: latest
    argocd-image-updater.argoproj.io/client-gateway.pull-secret: pullsecret:argocd/ecr-credentials
spec:
  replicas: 3
  selector:
    matchLabels:
      app: client-gateway
  template:
    metadata:
      labels:
        app: client-gateway
    spec:
      containers:
        - name: client-gateway
          image: 515966498907.dkr.ecr.us-east-2.amazonaws.com/cominow/client-gateway:801c006006bab73301f3597890ac1f45a862743a
          ports:
            - containerPort: 3000
          env:
            - name: PORT
              value: "3000"
            - name: NATS_SERVICE_NAME
              value: "NATS_SERVICE"
            - name: NATS_SERVERS
              value: "nats://nats-server:4222"
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          livenessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            tcpSocket:
              port: 3000
            initialDelaySeconds: 10
            periodSeconds: 5
---
apiVersion: v1
kind: Service
metadata:
  name: client-gateway
  namespace: cominow
  labels:
    app: client-gateway
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: "nlb"
    service.beta.kubernetes.io/aws-load-balancer-scheme: "internet-facing"
spec:
  type: LoadBalancer
  ports:
    - port: 80
      targetPort: 3000
      protocol: TCP
  selector:
    app: client-gateway
