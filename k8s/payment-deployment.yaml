apiVersion: apps/v1
kind: Deployment
metadata:
  name: payment-microservice
  namespace: cominow
  labels:
    app: payment-microservice
  annotations:
    argocd-image-updater.argoproj.io/image-list: payment=515966498907.dkr.ecr.us-east-2.amazonaws.com/cominow/payment-microservice
    argocd-image-updater.argoproj.io/payment.update-strategy: latest
    argocd-image-updater.argoproj.io/payment.pull-secret: pullsecret:argocd/ecr-credentials
spec:
  replicas: 2
  selector:
    matchLabels:
      app: payment-microservice
  template:
    metadata:
      labels:
        app: payment-microservice
    spec:
      containers:
        - name: payment-microservice
          image: 515966498907.dkr.ecr.us-east-2.amazonaws.com/cominow/payment-microservice:latest
          ports:
            - containerPort: 3004
          env:
            - name: PORT
              value: "3004"
            - name: NATS_SERVICE_NAME
              value: "NATS_SERVICE"
            - name: NATS_SERVERS
              value: "nats://nats-server:4222"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: cominow-secrets
                  key: PAYMENTS_DATABASE_URL
            - name: MERCADO_PAGO_ACCESS_TOKEN
              valueFrom:
                secretKeyRef:
                  name: cominow-secrets
                  key: MERCADO_PAGO_ACCESS_TOKEN
            - name: MERCADO_PAGO_WEBHOOK_SECRET
              valueFrom:
                secretKeyRef:
                  name: cominow-secrets
                  key: MERCADO_PAGO_WEBHOOK_SECRET
            - name: APP_SERVICE_CLIENT_BASE_URL
              value: "https://d3gwsdg49ynx4o.cloudfront.net"
            - name: ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: cominow-secrets
                  key: ENCRYPTION_KEY
            - name: APP_SECRET
              valueFrom:
                secretKeyRef:
                  name: cominow-secrets
                  key: APP_SECRET
          resources:
            requests:
              memory: "256Mi"
              cpu: "100m"
            limits:
              memory: "512Mi"
              cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: payment-microservice
  namespace: cominow
  labels:
    app: payment-microservice
spec:
  type: ClusterIP
  ports:
    - port: 3004
      targetPort: 3004
      protocol: TCP
  selector:
    app: payment-microservice
